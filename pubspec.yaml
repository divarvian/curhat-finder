name: curhat_finder
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.8.3
  emoji_picker_flutter: ^4.5.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  uuid: ^4.6.0
  connectivity_plus: ^7.3.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  flutter_native_splash: ^2.4.8
  build_runner: ^2.15.1
  freezed: ^4.0.3
  json_serializable: ^6.14.0
  go_router_builder: ^4.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/nav/
    - assets/icons/
    - assets/data/
  fonts:
    - family: Gilroy-Light
      fonts:
        - asset: assets/fonts/Gilroy-Light.ttf
    - family: Gilroy-Regular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: Gilroy-Medium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: Gilroy-Bold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: Gilroy-Heavy
      fonts:
        - asset: assets/fonts/Gilroy-Heavy.ttf
icons_launcher:
  image_path: "assets/icons/icon_launcher.png" # Gambar Launcher
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter_native_splash:
  color: "#F4F8FB" # Warna background splash screen (Platinum)
  color_dark: "#F4F8FB" # Pastikan tetap terang di Dark Mode
  image: "assets/images/logo.png" # Menggunakan logo.png
  android: true # Aktifkan di Android
  ios: true # Aktifkan di iOS
  android_12:
    color: "#F4F8FB"
    color_dark: "#F4F8FB"
    image: "assets/images/logo.png"

