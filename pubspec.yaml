name: flutter_starter_template
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.2.1
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  flutter_bloc: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Gilroy-Light
      fonts:
        - asset: assets/fonts/Gilroy-Light.ttf
    - family: Gilroy-Regular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: Gilroy-Medium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: Gilroy-Bold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: Gilroy-Heavy
      fonts:
        - asset: assets/fonts/Gilroy-Heavy.ttf
icons_launcher:
  image_path: "assets/icons/icon_launcher.png" # Gambar Launcher
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter_native_splash:
  color: "#F4F8FB" # Warna background splash screen (Platinum)
  color_dark: "#F4F8FB" # Pastikan tetap terang di Dark Mode
  image: "assets/images/logo.png" # Menggunakan logo.png
  android: true # Aktifkan di Android
  ios: true # Aktifkan di iOS
  android_12:
    color: "#F4F8FB"
    color_dark: "#F4F8FB"
    image: "assets/images/logo.png"

